name: Generate Changelog

on:
  push:
    branches:
      - main
    paths:
      - "server/**/*.ts"
      - "client/src/**/*.tsx"
      - "client/src/**/*.ts"
      - "lib/**/*.ts"
      - "VERSION"
  workflow_dispatch:
    inputs:
      log_base:
        description: "Commit SHA to summarise commit messages from (base..HEAD), for releases too large to diff"
        required: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          LOG_BASE_OVERRIDE: ${{ inputs.log_base }}
        run: bash .github/scripts/generate-changelog.sh
