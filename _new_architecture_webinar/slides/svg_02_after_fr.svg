<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="72" font-size="36" font-weight="bold" fill="#0f172a">Après : trois étapes claires, un flux à sens unique</text>

  <defs>
    <marker id="grayarrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Stage 1: Instance -->
  <g transform="translate(64,130)">
    <rect width="330" height="460" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="165" y="46" font-size="24" font-weight="bold" fill="#1e40af" text-anchor="middle">1. Entrée des données</text>
    <text x="165" y="74" font-size="17" fill="#1e40af" text-anchor="middle">(niveau instance)</text>
    <g font-size="17" fill="#1e3a8a">
      <rect x="28" y="100" width="274" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="165" y="133" text-anchor="middle">Téléversements HMIS &amp; DHIS2</text>
      <rect x="28" y="168" width="274" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="165" y="201" text-anchor="middle">Enquêtes FOSA</text>
      <rect x="28" y="236" width="274" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="165" y="269" text-anchor="middle">Établissements &amp; zones admin.</text>
      <rect x="28" y="304" width="274" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
      <text x="165" y="337" text-anchor="middle">Définitions des indicateurs</text>
    </g>
    <text x="165" y="420" font-size="16" fill="#1e40af" text-anchor="middle" font-style="italic">Vivantes et toujours</text>
    <text x="165" y="442" font-size="16" fill="#1e40af" text-anchor="middle" font-style="italic">à jour</text>
  </g>

  <path d="M400 360 H 452" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#grayarrow)"/>
  <text x="428" y="340" font-size="15" fill="#475569" text-anchor="middle">générer</text>

  <!-- Stage 2: Results packages -->
  <g transform="translate(464,130)">
    <rect width="360" height="460" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <text x="180" y="46" font-size="24" font-weight="bold" fill="#92400e" text-anchor="middle">2. Paquets de résultats</text>
    <text x="180" y="74" font-size="17" fill="#92400e" text-anchor="middle">(l'analyse s'exécute une fois)</text>
    <!-- package cards -->
    <g>
      <rect x="36" y="100" width="288" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <text x="52" y="136" font-size="18" font-weight="bold" fill="#92400e">Paquet : janv. 2026</text>
      <text x="52" y="162" font-size="14" fill="#a16207">données + paramètres + résultats, scellés</text>
      <rect x="36" y="204" width="288" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <text x="52" y="240" font-size="18" font-weight="bold" fill="#92400e">Paquet : avr. 2026</text>
      <text x="52" y="266" font-size="14" fill="#a16207">données + paramètres + résultats, scellés</text>
      <rect x="36" y="308" width="288" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
      <text x="52" y="344" font-size="18" font-weight="bold" fill="#92400e">Paquet : juil. 2026</text>
      <text x="52" y="370" font-size="14" fill="#a16207">données + paramètres + résultats, scellés</text>
    </g>
    <text x="180" y="430" font-size="16" fill="#92400e" text-anchor="middle" font-style="italic">Un catalogue d'instantanés</text>
    <text x="180" y="452" font-size="16" fill="#92400e" text-anchor="middle" font-style="italic">d'analyse figés et réutilisables</text>
  </g>

  <!-- Stage 3: Projects -->
  <g transform="translate(886,130)">
    <rect width="330" height="460" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="165" y="46" font-size="24" font-weight="bold" fill="#065f46" text-anchor="middle">3. Projets</text>
    <text x="165" y="74" font-size="17" fill="#065f46" text-anchor="middle">(donner du sens)</text>
    <g font-size="18" fill="#065f46">
      <rect x="28" y="100" width="274" height="76" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="165" y="132" text-anchor="middle" font-weight="bold">Projet A</text>
      <text x="165" y="158" text-anchor="middle" font-size="15">visualisations · rapports</text>
      <rect x="28" y="192" width="274" height="76" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="165" y="224" text-anchor="middle" font-weight="bold">Projet B</text>
      <text x="165" y="250" text-anchor="middle" font-size="15">diaporamas · tableaux de bord</text>
      <rect x="28" y="284" width="274" height="76" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
      <text x="165" y="316" text-anchor="middle" font-weight="bold">Projet C</text>
      <text x="165" y="342" text-anchor="middle" font-size="15">interprétation IA</text>
    </g>
    <text x="165" y="420" font-size="16" fill="#065f46" text-anchor="middle" font-style="italic">Espaces de création légers —</text>
    <text x="165" y="442" font-size="16" fill="#065f46" text-anchor="middle" font-style="italic">sans données, sans traitement</text>
  </g>

  <!-- attach arrows from projects back to one package -->
  <g stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#greenarrow)">
    <path d="M914 268 C 860 280, 840 330, 828 356"/>
    <path d="M914 360 C 880 362, 860 364, 828 366"/>
    <path d="M914 452 C 860 440, 840 400, 828 380"/>
  </g>
  <text x="858" y="300" font-size="15" fill="#059669" font-style="italic" text-anchor="middle">rattacher</text>

  <text x="64" y="668" font-size="18" fill="#334155">Les trois projets lisent le même paquet partagé — généré une fois, utilisé partout, jamais modifié silencieusement.</text>
</svg>
