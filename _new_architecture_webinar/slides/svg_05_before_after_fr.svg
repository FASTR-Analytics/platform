<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="72" font-size="36" font-weight="bold" fill="#0f172a">Avant et après, côte à côte</text>

  <!-- header row -->
  <g font-size="22" font-weight="bold">
    <rect x="424" y="110" width="392" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="620" y="148" fill="#991b1b" text-anchor="middle">Avant</text>
    <rect x="816" y="110" width="400" height="60" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="1016" y="148" fill="#065f46" text-anchor="middle">Après</text>
  </g>

  <!-- rows -->
  <g font-size="18">
    <!-- row 1 -->
    <rect x="64" y="170" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="216" font-weight="bold" fill="#0f172a">Où s'exécute l'analyse</text>
    <rect x="424" y="170" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="205" fill="#334155">Dans chaque projet,</text>
    <text x="444" y="230" fill="#334155">encore et encore</text>
    <rect x="816" y="170" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="205" fill="#334155">Une fois, au niveau instance —</text>
    <text x="836" y="230" fill="#334155">partagée par tous les projets</text>

    <!-- row 2 -->
    <rect x="64" y="250" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="296" font-weight="bold" fill="#0f172a">Copies des données</text>
    <rect x="424" y="250" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="285" fill="#334155">Une copie complète par projet</text>
    <text x="444" y="310" fill="#334155">(des centaines de Go parfois)</text>
    <rect x="816" y="250" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="285" fill="#334155">Quelques paquets compacts</text>
    <text x="836" y="310" fill="#334155">(résultats ~20&#215; plus légers)</text>

    <!-- row 3 -->
    <rect x="64" y="330" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="376" font-weight="bold" fill="#0f172a">Quand vos chiffres changent</text>
    <rect x="424" y="330" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="365" fill="#334155">Dès que les données changeaient —</text>
    <text x="444" y="390" fill="#334155">parfois silencieusement</text>
    <rect x="816" y="330" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="365" fill="#334155">Uniquement quand vous basculez</text>
    <text x="836" y="390" fill="#334155">vers un nouveau paquet</text>

    <!-- row 4 -->
    <rect x="64" y="410" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="456" font-weight="bold" fill="#0f172a">Partage des résultats</text>
    <rect x="424" y="410" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="445" fill="#334155">Impossible — résultats enfermés</text>
    <text x="444" y="470" fill="#334155">dans chaque projet</text>
    <rect x="816" y="410" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="445" fill="#334155">Un paquet peut servir un nombre</text>
    <text x="836" y="470" fill="#334155">illimité de projets</text>

    <!-- row 5 -->
    <rect x="64" y="490" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="536" font-weight="bold" fill="#0f172a">Retracer l'origine des chiffres</text>
    <rect x="424" y="490" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="525" fill="#334155">Difficile à reconstituer après un</text>
    <text x="444" y="550" fill="#334155">changement de données ou réglages</text>
    <rect x="816" y="490" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="525" fill="#334155">Chaque paquet consigne données,</text>
    <text x="836" y="550" fill="#334155">réglages, scripts et journaux</text>

    <!-- row 6 -->
    <rect x="64" y="570" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="616" font-weight="bold" fill="#0f172a">Vitesse des graphiques lourds</text>
    <rect x="424" y="570" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="605" fill="#334155">Les grosses requêtes pouvaient</text>
    <text x="444" y="630" fill="#334155">prendre plusieurs secondes</text>
    <rect x="816" y="570" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="605" fill="#334155">Les mêmes requêtes répondent</text>
    <text x="836" y="630" fill="#334155">en une fraction de seconde</text>
  </g>
</svg>
