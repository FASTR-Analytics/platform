<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="72" font-size="36" font-weight="bold" fill="#0f172a">What is inside a results package?</text>

  <!-- outer sealed box -->
  <rect x="140" y="120" width="1000" height="470" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>

  <!-- padlock -->
  <g transform="translate(1114,88)">
    <rect x="0" y="22" width="52" height="40" rx="7" fill="#92400e"/>
    <path d="M10 22 v-6 a16 16 0 0 1 32 0 v6" fill="none" stroke="#92400e" stroke-width="7"/>
    <circle cx="26" cy="40" r="5" fill="#fffbeb"/>
  </g>

  <text x="180" y="170" font-size="24" font-weight="bold" fill="#92400e">One sealed folder — everything the analysis used, and everything it produced</text>

  <!-- Inputs column -->
  <g transform="translate(180,200)">
    <rect width="440" height="340" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="220" y="42" font-size="22" font-weight="bold" fill="#1e40af" text-anchor="middle">Inputs (what went in)</text>
    <g font-size="18" fill="#1e3a8a">
      <text x="32" y="88">&#8226;  The exact data extracts analysed</text>
      <text x="32" y="126">&#8226;  Which modules ran, at which version</text>
      <text x="32" y="164">&#8226;  Every setting and parameter chosen</text>
      <text x="32" y="202">&#8226;  Facility list and admin areas</text>
      <text x="32" y="240">&#8226;  Indicator definitions</text>
      <text x="32" y="278">&#8226;  Country, calendar, language settings</text>
    </g>
  </g>

  <!-- Outputs column -->
  <g transform="translate(660,200)">
    <rect width="440" height="340" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="220" y="42" font-size="22" font-weight="bold" fill="#065f46" text-anchor="middle">Outputs (what came out)</text>
    <g font-size="18" fill="#065f46">
      <text x="32" y="88">&#8226;  All result tables, in a fast format</text>
      <text x="32" y="126">&#8226;  The exact R script that ran</text>
      <text x="32" y="164">&#8226;  The full execution logs</text>
      <text x="32" y="202">&#8226;  A manifest describing every result:</text>
      <text x="56" y="240">what is available, over which periods,</text>
      <text x="56" y="278">with which breakdowns</text>
    </g>
  </g>

  <g transform="translate(64,650)">
    <text x="0" y="0" font-size="20" fill="#334155">Sealed on creation and never edited afterwards — so anyone can see exactly where every number came from.</text>
  </g>
</svg>
