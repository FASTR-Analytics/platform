<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="72" font-size="36" font-weight="bold" fill="#0f172a">New data never changes your project — until you say so</text>

  <defs>
    <marker id="grayarrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="greenarrow2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="fadedarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(64,150)">
    <circle cx="24" cy="24" r="22" fill="#2563eb"/>
    <text x="24" y="32" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="62" y="32" font-size="23" font-weight="bold" fill="#0f172a">New data arrives on the instance</text>
    <text x="62" y="62" font-size="18" fill="#475569">A new quarter of HMIS data is uploaded or imported from DHIS2.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(64,260)">
    <circle cx="24" cy="24" r="22" fill="#d97706"/>
    <text x="24" y="32" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="62" y="32" font-size="23" font-weight="bold" fill="#0f172a">An admin generates a new results package</text>
    <text x="62" y="62" font-size="18" fill="#475569">The existing package is untouched. Both now sit in the catalogue.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(64,370)">
    <circle cx="24" cy="24" r="22" fill="#059669"/>
    <text x="24" y="32" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="62" y="32" font-size="23" font-weight="bold" fill="#0f172a">Each project switches when it is ready</text>
    <text x="62" y="62" font-size="18" fill="#475569">One click, with a compatibility check first. Or stay on the old package — for a report already in review, nothing moves.</text>
  </g>

  <!-- diagram right side -->
  <g transform="translate(700,480)">
  </g>

  <!-- packages row -->
  <g transform="translate(160,490)">
    <rect width="330" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="none"/>
    <text x="165" y="42" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Package: Q1 2026</text>
    <text x="165" y="70" font-size="16" fill="#a16207" text-anchor="middle">still there, still identical</text>
    <text x="165" y="100" font-size="16" fill="#a16207" text-anchor="middle" font-style="italic">Project C stays here</text>
  </g>
  <g transform="translate(620,490)">
    <rect width="330" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="165" y="42" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Package: Q2 2026 (new)</text>
    <text x="165" y="70" font-size="16" fill="#a16207" text-anchor="middle">includes the new quarter</text>
    <text x="165" y="100" font-size="16" fill="#a16207" text-anchor="middle" font-style="italic">Projects A and B switch</text>
  </g>
  <path d="M500 555 H 608" stroke="#475569" stroke-width="3.5" fill="none" marker-end="url(#grayarrow2)"/>
  <text x="554" y="540" font-size="15" fill="#475569" text-anchor="middle">generate</text>

  <!-- side note -->
  <g transform="translate(1000,490)">
    <rect width="216" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="108" y="40" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Old packages remain</text>
    <text x="108" y="66" font-size="15" fill="#475569" text-anchor="middle">available for reference,</text>
    <text x="108" y="90" font-size="15" fill="#475569" text-anchor="middle">audit, and comparing</text>
    <text x="108" y="114" font-size="15" fill="#475569" text-anchor="middle">then vs now</text>
  </g>
</svg>
