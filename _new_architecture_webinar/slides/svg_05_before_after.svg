<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="72" font-size="36" font-weight="bold" fill="#0f172a">Before and after, side by side</text>

  <!-- header row -->
  <g font-size="22" font-weight="bold">
    <rect x="424" y="110" width="392" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="620" y="148" fill="#991b1b" text-anchor="middle">Before</text>
    <rect x="816" y="110" width="400" height="60" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="1016" y="148" fill="#065f46" text-anchor="middle">After</text>
  </g>

  <!-- rows -->
  <g font-size="18">
    <!-- row 1 -->
    <rect x="64" y="170" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="216" font-weight="bold" fill="#0f172a">Where the analysis runs</text>
    <rect x="424" y="170" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="205" fill="#334155">Inside every single project,</text>
    <text x="444" y="230" fill="#334155">over and over</text>
    <rect x="816" y="170" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="205" fill="#334155">Once, at instance level —</text>
    <text x="836" y="230" fill="#334155">shared by all projects</text>

    <!-- row 2 -->
    <rect x="64" y="250" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="296" font-weight="bold" fill="#0f172a">Copies of the data</text>
    <rect x="424" y="250" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="285" fill="#334155">One full copy per project</text>
    <text x="444" y="310" fill="#334155">(hundreds of GB in big instances)</text>
    <rect x="816" y="250" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="285" fill="#334155">A handful of compact packages</text>
    <text x="836" y="310" fill="#334155">(results stored ~20&#215; smaller)</text>

    <!-- row 3 -->
    <rect x="64" y="330" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="376" font-weight="bold" fill="#0f172a">When your numbers change</text>
    <rect x="424" y="330" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="365" fill="#334155">Whenever data changed and</text>
    <text x="444" y="390" fill="#334155">modules re-ran — sometimes silently</text>
    <rect x="816" y="330" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="365" fill="#334155">Only when you deliberately switch</text>
    <text x="836" y="390" fill="#334155">to a new package</text>

    <!-- row 4 -->
    <rect x="64" y="410" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="456" font-weight="bold" fill="#0f172a">Sharing results</text>
    <rect x="424" y="410" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="445" fill="#334155">Impossible — results were</text>
    <text x="444" y="470" fill="#334155">locked inside each project</text>
    <rect x="816" y="410" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="445" fill="#334155">One package can serve</text>
    <text x="836" y="470" fill="#334155">any number of projects</text>

    <!-- row 5 -->
    <rect x="64" y="490" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="536" font-weight="bold" fill="#0f172a">Knowing where numbers came from</text>
    <rect x="424" y="490" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="525" fill="#334155">Hard to reconstruct after</text>
    <text x="444" y="550" fill="#334155">data or settings changed</text>
    <rect x="816" y="490" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="525" fill="#334155">Every package records its exact</text>
    <text x="836" y="550" fill="#334155">data, settings, scripts and logs</text>

    <!-- row 6 -->
    <rect x="64" y="570" width="360" height="80" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="84" y="616" font-weight="bold" fill="#0f172a">Speed of heavy charts</text>
    <rect x="424" y="570" width="392" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="444" y="605" fill="#334155">Big uncached queries could</text>
    <text x="444" y="630" fill="#334155">take many seconds</text>
    <rect x="816" y="570" width="400" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="836" y="605" fill="#334155">Same queries return in a fraction</text>
    <text x="836" y="630" fill="#334155">of a second</text>
  </g>
</svg>
