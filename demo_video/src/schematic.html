<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Schematic</title>
    <link rel="stylesheet" href="kit.css" />
    <style>
    .platform {
      position: absolute;
      left: 640px;
      top: 320px;
      width: 720px;
      height: 420px;
      box-sizing: border-box;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid var(--card-border);
    }
    .platform .plabel {
      position: absolute;
      left: 40px;
      top: 26px;
      color: var(--teal);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .node {
      height: 96px;
      font-size: 30px;
    }
    .chip {
      height: 60px;
      font-size: 26px;
      padding: 0 24px 0 16px;
      gap: 14px;
      border-radius: 30px;
    }
    .chip svg {
      width: 34px;
      height: 34px;
    }
    .node.next {
      border: 3px dashed #8aa324;
      color: var(--ink);
      background: #f3f7d9;
      box-shadow: none;
    }
    [data-a] {
      opacity: 0;
    }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="c1"></div>
      <div class="c2"></div>
      <img class="logo" src="../../client/public/images/logo.png" />
      <svg class="arrows" id="arrows"></svg>
    </div>
    <script type="module">
    import { anim, arrow, icons, setTime } from "./kit.js";
    const q = new URLSearchParams(location.search);
    const V2 = q.get("v") === "2";
    const stage = document.getElementById("stage");
    const add = (html) => {
      stage.insertAdjacentHTML("beforeend", html);
      return stage.lastElementChild;
    };
    const node = (x, y, w, icon, label, cls = "") =>
      add(
        `<div class="node ${cls}" style="left:${x}px;top:${y}px;width:${w}px">${
          icons[icon]
        }<span>${label}</span></div>`,
      );
    const stagebox = (x, label) =>
      add(
        `<div class="stagebox" style="left:${x}px;top:400px;width:170px;height:110px">${label}</div>`,
      );
    const chip = (x, y, icon, text, next) =>
      add(
        `<div class="chip ${
          next ? "next" : ""
        }" style="left:${x}px;top:${y}px"><span class="tag">${
          next ? "Future" : "Now"
        }</span>${icons[icon]}<span>${text}</span></div>`,
      );

    // Version 1 builds in; version 2 starts from the finished picture and
    // adds the automation items one by one.
    const A = (el, start, dur, kind) =>
      anim(el, V2 ? 0 : start, V2 ? 0.01 : dur, kind);

    const sources = [["database", "DHIS2"], ["clipboard", "Facility assessments"], [
      "people",
      "Household surveys",
    ]];
    sources.forEach(([ic, l], i) =>
      A(node(140, 372 + i * 120, 380, ic, l), 0.2 + i * 0.25, 0.5)
    );
    A(
      add(
        `<div class="platform"><div class="plabel">FASTR Analytics Platform</div></div>`,
      ),
      1.3,
      0.5,
    );
    A(stagebox(680, "Data"), 1.7, 0.5, "pop");
    A(stagebox(905, "Analysis"), 2.5, 0.5, "pop");
    A(stagebox(1130, "Results"), 3.3, 0.5, "pop");
    A(
      add(
        `<div class="band" style="left:680px;top:600px;width:620px;height:72px">${
          icons.sparkle.replace("<svg", '<svg style="width:36px;height:36px"')
        }AI assistant</div>`,
      ),
      4.0,
      0.6,
    );
    A(node(1440, 347, 360, "slides", "Slide decks"), 5.0, 0.5);
    A(node(1440, 467, 360, "report", "Reports"), 5.25, 0.5);

    const svg = document.getElementById("arrows");
    const heads = [];
    const addArrow = (a, start, dur) => {
      svg.insertAdjacentHTML("beforeend", a.path + a.head);
      const head = svg.lastElementChild;
      const path = head.previousElementSibling;
      anim(path, V2 ? 0 : start, V2 ? 0.01 : dur, "draw");
      head.style.opacity = "0";
      heads.push({
        head,
        start: V2 ? 0 : start + dur * 0.8,
        dur: V2 ? 0.01 : dur * 0.3,
      });
    };
    sources.forEach((_, i) =>
      addArrow(
        arrow(522, 420 + i * 120, 676, 425 + i * 30, { bend: (i - 1) * -16 }),
        1.1 + i * 0.1,
        0.6,
      )
    );
    addArrow(arrow(852, 455, 901, 455), 2.3, 0.3);
    addArrow(arrow(1077, 455, 1126, 455), 3.1, 0.3);
    addArrow(arrow(1302, 440, 1436, 395, { bend: -8 }), 4.7, 0.5);
    addArrow(arrow(1302, 470, 1436, 515, { bend: 8 }), 4.7, 0.5);

    if (V2) {
      anim(chip(140, 760, "clock", "Scheduled imports", false), 0.6, 0.5);
      anim(chip(1440, 613, "clock", "Scheduled reports", true), 1.8, 0.5, "pop");
      anim(chip(1440, 693, "bell", "Alerts on disruptions", true), 3.0, 0.5, "pop");
    }

    const DURATION = 7;
    window.setTime = (t) => {
      setTime(t);
      for (const h of heads) {
        h.head.style.opacity = String(
          Math.max(0, Math.min(1, (t - h.start) / h.dur)),
        );
      }
    };
    window.DURATION = DURATION;
    await document.fonts.ready;
    document.body.dataset.ready = "1";
    if (q.has("t")) window.setTime(Number(q.get("t")));
    else {
      const t0 = performance.now();
      const step = () => {
        const t = (performance.now() - t0) / 1000;
        window.setTime(Math.min(t, DURATION));
        if (t < DURATION) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    </script>
  </body>
</html>
